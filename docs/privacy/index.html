<!doctype html>
<html lang="en">
<head>

  <link rel="alternate" hreflang="en" href="../en/privacy/">
  <link rel="alternate" hreflang="pl" href="../pl/privacy/">

    // Stable entry used by the game: forward to the policy in the browser's language.
    (function () {
      var languages = navigator.languages || [navigator.language || ""];
      var polish = String(languages[0] || "").toLowerCase().indexOf("pl") === 0;
      location.replace(polish ? "../pl/privacy/" : "../en/privacy/");
    })();
  </script>
</head>
<body>

    <div class="wrap">

        <div class="choices">
          <a class="button" href="../en/privacy/" hreflang="en">English</a>
          <a class="button" href="../pl/privacy/" hreflang="pl" lang="pl">Polski</a>
        </div>
      </nav>
    </div>
  </main>
</body>
</html>
